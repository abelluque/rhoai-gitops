# Source: rhcl/charts/install-rhcl/templates/install-plan-approvals.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: approve-rhcl-operator-script
  namespace: kuadrant-system
  labels:
    app.kubernetes.io/name: install-rhcl
    app.kubernetes.io/instance: rhcl
    app.kubernetes.io/version: "0.1.0"
data:
  approve-operator.sh: |-
    #!/bin/bash
    
    NAMESPACE="kuadrant-system"
    WAIT_TIMEOUT="${WAIT_TIMEOUT:-240}"
    
    function approve_install_plan {
      set -x
      oc patch installplan "$1" -n "${NAMESPACE}" --patch '{"spec": {"approved": true}}' --type merge
      { set +x ; } 2>/dev/null
    }
    
    function find_install_plans {
      oc get installplan -n "${NAMESPACE}" \
        -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.approved}{"\n"}{end}' 2>/dev/null \
        | while IFS=$'\t' read -r name approved; do
            [ -z "${name}" ] && continue
            if [ "${approved}" != "true" ]; then
              echo "${name}"
            fi
          done
    }

    function rhcl_ready {
      oc get csv -n "${NAMESPACE}" -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.phase}{"\n"}{end}' 2>/dev/null \
        | awk -F '\t' '$1 ~ /^rhcl-operator/ && $2 == "Succeeded" { found=1 } END { exit found ? 0 : 1 }'
    }
    
    echo "Waiting up to ${WAIT_TIMEOUT}s for an RHCL InstallPlan or a Succeeded CSV in ${NAMESPACE}"
    elapsed=0
    while true; do
      if rhcl_ready; then
        echo "RHCL CSV already Succeeded"
        exit 0
      fi
      install_plans=( $(find_install_plans) )
      if [ "${#install_plans[@]}" -gt 0 ]; then
        echo
        for install_plan in "${install_plans[@]}"; do
          if [ -z "$install_plan" ]; then
            continue
          fi
          approved=$(oc get installplan "$install_plan" -n "${NAMESPACE}" -o jsonpath='{.spec.approved}')
          if [ "$approved" != "true" ]; then
            approve_install_plan "$install_plan"
          else
            echo "InstallPlan ${install_plan} already approved"
          fi
        done
        exit 0
      fi
      if [ "${elapsed}" -ge "${WAIT_TIMEOUT}" ]; then
        echo "Timed out after ${WAIT_TIMEOUT}s waiting for an RHCL InstallPlan in ${NAMESPACE}" >&2
        echo "The Subscription follows the stable channel head for this OpenShift version." >&2
        oc get subscription,installplan,csv -n "${NAMESPACE}" >&2 || true
        exit 1
      fi
      echo -n '.'
      sleep 5
      elapsed=$((elapsed + 5))
    done
