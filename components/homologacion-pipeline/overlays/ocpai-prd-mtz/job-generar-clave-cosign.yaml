apiVersion: batch/v1
kind: Job
metadata:
  name: generar-clave-cosign
  namespace: homolog-pipeline
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      serviceAccountName: cosign-keygen
      restartPolicy: Never
      containers:
        - name: generar
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if oc get secret cosign-key -n homolog-pipeline >/dev/null 2>&1; then
                echo "La clave cosign-key ya existe; no se regenera."
                exit 0
              fi
              curl -sSfL --proxy http://10.214.130.110:80 -o /tmp/cosign https://github.com/sigstore/cosign/releases/download/v2.4.1/cosign-linux-amd64
              chmod +x /tmp/cosign
              export COSIGN_PASSWORD="$(head -c 32 /dev/urandom | base64)"
              cd /tmp && /tmp/cosign generate-key-pair k8s://homolog-pipeline/cosign-key
              echo "Clave de firma creada en el Secret homolog-pipeline/cosign-key."
