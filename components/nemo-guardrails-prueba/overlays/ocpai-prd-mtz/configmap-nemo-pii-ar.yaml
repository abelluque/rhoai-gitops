apiVersion: v1
kind: ConfigMap
metadata:
  name: nemo-pii-ar
  namespace: rhoai-nemo-prueba
data:
  config.yaml: |
    rails:
      config:
        regex_detection:
          input:
            patterns:
              - '(?is)\bolvid\w*\b.{0,40}\b(instrucci\w*|reglas|indicaciones|pol[ií]ticas)'
              - '(?is)\bignor\w*\b.{0,40}\b(instrucci\w*|reglas|indicaciones|pol[ií]ticas)'
              - '(?is)\bejecut\w*\s+(el|lo)\s+(siguiente|que\s+sigue)'
              - '(?is)\bevad\w*\b.{0,30}\b(control\w*|filtro\w*|restricci\w*)'
              - '(?is)\b(modo\s+desarrollador|developer\s+mode|jailbreak|DAN)\b'
              - '(?is)\bdni\b\D{0,8}\d{1,2}\.?\d{3}\.?\d{3}\b'
      input:
        flows:
          - regex check input
          - check pii argentina input
      output:
        flows:
          - check pii argentina output
  rails.co: |
    define bot informar dato sensible
      "El mensaje contiene un CBU, CUIT o número de tarjeta y no puede procesarse."

    define flow check pii argentina input
      $pii = execute check_pii_argentina(source="input")
      if $pii == "blocked"
        bot informar dato sensible
        stop

    define flow check pii argentina output
      $pii = execute check_pii_argentina(source="output")
      if $pii == "blocked"
        bot informar dato sensible
        stop
  actions.py: |
    import logging
    import re
    from typing import Optional

    from nemoguardrails.actions import action

    log = logging.getLogger("pii_argentina")

    CANDIDATE = re.compile(r"(?<!\d)\d(?:[ .-]?\d){6,21}(?!\d)")
    CUIT_PREFIXES = {"20", "23", "24", "25", "26", "27", "30", "33", "34"}


    def luhn_ok(num):
        total = 0
        for i, ch in enumerate(reversed(num)):
            n = int(ch)
            if i % 2 == 1:
                n *= 2
                if n > 9:
                    n -= 9
            total += n
        return total % 10 == 0


    def cuit_ok(num):
        if len(num) != 11 or num[:2] not in CUIT_PREFIXES:
            return False
        s = sum(int(a) * b for a, b in zip(num[:10], (5, 4, 3, 2, 7, 6, 5, 4, 3, 2)))
        dv = 11 - s % 11
        dv = {11: 0, 10: 9}.get(dv, dv)
        return dv == int(num[10])


    def _cbu_block_ok(digits, weights):
        s = sum(int(a) * b for a, b in zip(digits[:-1], weights))
        return (10 - s % 10) % 10 == int(digits[-1])


    def cbu_ok(num):
        return (len(num) == 22
                and _cbu_block_ok(num[:8], (7, 1, 3, 9, 7, 1, 3))
                and _cbu_block_ok(num[8:], (3, 9, 7, 1, 3, 9, 7, 1, 3, 9, 7, 1, 3)))


    def find_pii(text):
        found = []
        for m in CANDIDATE.finditer(text or ""):
            num = re.sub(r"\D", "", m.group())
            if len(num) == 22 and cbu_ok(num):
                found.append(("CBU", num))
            elif len(num) == 11 and cuit_ok(num):
                found.append(("CUIT", num))
            elif 13 <= len(num) <= 19 and luhn_ok(num):
                found.append(("TARJETA", num))
        return found


    def mask(num):
        return "*" * (len(num) - 4) + num[-4:]


    @action(is_system_action=True)
    async def check_pii_argentina(context: Optional[dict] = None, source: str = "input") -> str:
        key = "bot_message" if source == "output" else "user_message"
        found = find_pii((context or {}).get(key, ""))
        if not found:
            return "allowed"
        log.warning("pii_argentina source=%s hallazgos=%s", source,
                    ",".join(f"{kind}:{mask(num)}" for kind, num in found))
        return "blocked"
