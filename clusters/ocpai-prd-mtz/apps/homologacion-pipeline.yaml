apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homologacion-pipeline
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai-maas
    rhoai.example.com/cluster: ocpai-prd-mtz
  annotations:
    argocd.argoproj.io/sync-wave: "7"
    argocd.argoproj.io/compare-options: ServerSideDiff=true,IncludeMutationWebhook=true
spec:
  project: rhoai
  source:
    repoURL: https://github.com/surtecnologias/rhoai-gitops.git
    targetRevision: main
    path: components/homologacion-pipeline/overlays/ocpai-prd-mtz
  destination:
    server: https://kubernetes.default.svc
    namespace: homolog-pipeline
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
