# Counts usage.total_tokens against the Limitador limits the MaaS
# subscriptions already define, and answers 429 on the next request.
# Kuadrant's wasm plugin never reports the body, so this filter does.
# One counter per model and subscription: Authorino blanks the
# Authorization header, so the caller is the X-MaaS-Subscription it sets.
#
# Guardrails del PDF, en los tres chats. El filtro mira el texto.
# No calcula modulo 11 ni el digito del CBU. Una respuesta en streaming
# pasa de a pedazos, sin retenerse, y no se reescribe; al pedido en
# streaming se le agrega include_usage para contar sus tokens.
# La exfiltracion solo se anota.
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: granite-t11-count
  namespace: openshift-ingress
spec:
  workloadSelector:
    labels:
      gateway.networking.k8s.io/gateway-name: maas-default-gateway
  configPatches:
    - applyTo: CLUSTER
      match:
        context: GATEWAY
      patch:
        operation: ADD
        value:
          name: t11-limitador
          connect_timeout: 1s
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: t11-limitador
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: limitador-limitador.kuadrant-system.svc.cluster.local
                          port_value: 8080
    - applyTo: HTTP_FILTER
      match:
        context: GATEWAY
        listener:
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
              subFilter:
                name: envoy.filters.http.router
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              local routes = {
                {
                  path = "/ai-models/granite-3-0-8b-instruct/",
                  model = "granite-3-0-8b-instruct",
                  ns = "ai-models/granite-3-0-8b-instruct-kserve-route",
                  key = "tokenlimit.models_as_a_service_free_models_subscription_granite_3_0_8b_instruct_tokens__0152d99b"
                },
                {
                  path = "/ai-models/qwen25-coder-32b/",
                  model = "qwen25-coder-32b",
                  ns = "ai-models/qwen25-coder-32b-kserve-route",
                  key = "tokenlimit.models_as_a_service_premium_models_subscription_qwen25_coder_32b_tokens__ee3989b3"
                },
                {
                  path = "/ai-models/deepseek-coder-33b/",
                  model = "deepseek-coder-33b",
                  ns = "ai-models/deepseek-coder-33b-kserve-route",
                  key = "tokenlimit.models_as_a_service_premium_models_subscription_deepseek_coder_33b_tokens__54fe0a8f"
                },
                {
                  path = "/ai-models/qwen25-72b/",
                  model = "qwen25-72b",
                  ns = "ai-models/qwen25-72b-kserve-route",
                  key = "tokenlimit.models_as_a_service_premium_models_subscription_qwen25_72b_tokens__5a5da29e"
                },
                {
                  path = "/ai-models-dev/granite-3-0-8b-instruct/",
                  model = "granite-3-0-8b-instruct",
                  ns = "ai-models-dev/granite-3-0-8b-instruct-kserve-route",
                  key = "tokenlimit.models_as_a_service_premium_models_subscription_granite_3_0_8b_instruct_tokens__27194327"
                }
              }
              local function lower_ascii(s)
                return (string.gsub(s, "%u", string.lower))
              end

              local function is_word(c)
                return c ~= "" and string.find(c, "[%w_]") ~= nil
              end

              local function skip_seps(s, i)
                while i <= #s do
                  local c = string.sub(s, i, i)
                  if c == " " or c == ":" or c == "#" or c == "-" or c == "." or c == "\t" then
                    i = i + 1
                  else
                    break
                  end
                end
                return i
              end

              local function skip_nro(s, i)
                i = skip_seps(s, i)
                if string.sub(s, i, i + 2) == "nro" and not is_word(string.sub(s, i + 3, i + 3)) then
                  return skip_seps(s, i + 3)
                end
                if string.sub(s, i, i + 6) == "numero" and not is_word(string.sub(s, i + 7, i + 7)) then
                  return skip_seps(s, i + 7)
                end
                return i
              end

              local function read_digits(text, i, minn, maxn)
                local n = 0
                local last = i - 1
                local j = i
                while j <= #text and n < maxn do
                  local c = string.sub(text, j, j)
                  if c >= "0" and c <= "9" then
                    n = n + 1
                    last = j
                    j = j + 1
                  elseif n > 0 and n < maxn and (c == " " or c == "-" or c == ".") then
                    local nxt = string.sub(text, j + 1, j + 1)
                    if nxt >= "0" and nxt <= "9" then
                      j = j + 1
                    else
                      break
                    end
                  else
                    break
                  end
                end
                if n >= minn and n <= maxn then
                  return i, last
                end
              end

              local function digits_of(text, s, e)
                local out = {}
                for i = s, e do
                  local c = string.sub(text, i, i)
                  if c >= "0" and c <= "9" then
                    out[#out + 1] = c
                  end
                end
                return table.concat(out)
              end

              local function luhn(digits)
                local sum = 0
                local alt = false
                for i = #digits, 1, -1 do
                  local d = string.byte(digits, i) - 48
                  if alt then
                    d = d * 2
                    if d > 9 then
                      d = d - 9
                    end
                  end
                  sum = sum + d
                  alt = not alt
                end
                return sum % 10 == 0
              end

              local function find_labels(low, labels)
                local found = {}
                for _, label in ipairs(labels) do
                  local from = 1
                  while true do
                    local s, e = string.find(low, label, from, true)
                    if s == nil then
                      break
                    end
                    local before = s > 1 and string.sub(low, s - 1, s - 1) or ""
                    local after = string.sub(low, e + 1, e + 1)
                    if not is_word(before) and not is_word(after) then
                      found[#found + 1] = e + 1
                    end
                    from = e + 1
                  end
                end
                table.sort(found)
                return found
              end

              local function labeled_digits(text, low, labels, minn, maxn, want_luhn)
                local spans = {}
                for _, pos in ipairs(find_labels(low, labels)) do
                  local i = skip_nro(low, pos)
                  local s, e = read_digits(text, i, minn, maxn)
                  if s ~= nil then
                    local digits = digits_of(text, s, e)
                    if not want_luhn or luhn(digits) then
                      spans[#spans + 1] = {s, e}
                    end
                  end
                end
                return spans
              end

              local function loose_cards(text)
                local spans = {}
                local i = 1
                while i <= #text do
                  local c = string.sub(text, i, i)
                  local before = i > 1 and string.sub(text, i - 1, i - 1) or ""
                  if c >= "0" and c <= "9" and not (before >= "0" and before <= "9") then
                    local s, e = read_digits(text, i, 13, 19)
                    if s ~= nil then
                      local digits = digits_of(text, s, e)
                      local after = string.sub(text, e + 1, e + 1)
                      if luhn(digits) and not (after >= "0" and after <= "9") then
                        spans[#spans + 1] = {s, e}
                        i = e + 1
                      else
                        i = i + 1
                      end
                    else
                      i = i + 1
                    end
                  else
                    i = i + 1
                  end
                end
                return spans
              end

              local function emails(text)
                local spans = {}
                local i = 1
                while true do
                  local s, e = string.find(text, "[%w%.%%%+%-_]+@[%w%.%-]+%.%a%a+", i)
                  if s == nil then
                    break
                  end
                  spans[#spans + 1] = {s, e}
                  i = e + 1
                end
                return spans
              end

              local function alias_spans(low)
                local spans = {}
                for _, pos in ipairs(find_labels(low, {"alias"})) do
                  local i = skip_seps(low, pos)
                  local j = i
                  local groups = 0
                  local seps = 0
                  local last = i - 1
                  while j <= #low do
                    local c = string.sub(low, j, j)
                    if (c >= "a" and c <= "z") or (c >= "0" and c <= "9") then
                      if groups == 0 then
                        groups = 1
                      end
                      last = j
                      j = j + 1
                    elseif (c == "." or c == "-") and groups > 0 and seps < 5 then
                      local nxt = string.sub(low, j + 1, j + 1)
                      if (nxt >= "a" and nxt <= "z") or (nxt >= "0" and nxt <= "9") then
                        seps = seps + 1
                        groups = groups + 1
                        j = j + 1
                      else
                        break
                      end
                    else
                      break
                    end
                  end
                  if seps >= 1 and groups >= 2 then
                    spans[#spans + 1] = {i, last}
                  end
                end
                return spans
              end

              local function assigned_secret(low, words)
                for _, word in ipairs(words) do
                  local from = 1
                  while true do
                    local s, e = string.find(low, word, from, true)
                    if s == nil then
                      break
                    end
                    local before = s > 1 and string.sub(low, s - 1, s - 1) or ""
                    local after = string.sub(low, e + 1, e + 1)
                    if not is_word(before) and not is_word(after) then
                      local i = e + 1
                      while string.sub(low, i, i) == " " or string.sub(low, i, i) == "\t" do
                        i = i + 1
                      end
                      local c = string.sub(low, i, i)
                      if c == ":" or c == "=" then
                        return true
                      end
                    end
                    from = e + 1
                  end
                end
                return false
              end

              local function has_bearer(low)
                return string.find(low, "bearer%s+[%w%.%_%~%+%/%-]+=*") ~= nil
              end

              local function has_apikey(low)
                local keys = {"api_key", "api-key", "apikey", "access_token", "client_secret", "secret_key"}
                for _, key in ipairs(keys) do
                  local from = 1
                  while true do
                    local s, e = string.find(low, key, from, true)
                    if s == nil then
                      break
                    end
                    local i = e + 1
                    while string.sub(low, i, i) == " " or string.sub(low, i, i) == "\t" do
                      i = i + 1
                    end
                    local c = string.sub(low, i, i)
                    if c == ":" or c == "=" then
                      local rest = string.sub(low, i + 1)
                      if string.find(rest, "^%s*[\"']?[%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-][%w%.%_%~%+%/%-]") ~= nil then
                        return true
                      end
                    end
                    from = e + 1
                  end
                end
                return false
              end

              local phrases = {
                "ignora las instrucciones",
                "ignore previous",
                "ignore the instructions",
                "ignore all instructions",
                "olvida las instrucciones",
                "anula las instrucciones",
                "reveal the system prompt",
                "revela el prompt del sistema",
                "trata el siguiente documento como instrucciones",
                "modo sin restricciones"
              }

              local function has_phrase(low)
                for _, phrase in ipairs(phrases) do
                  if string.find(low, phrase, 1, true) ~= nil then
                    return true
                  end
                end
                return false
              end

              local function has_exfil(low)
                local function near(a, b)
                  local s = string.find(low, a, 1, true)
                  if s == nil then
                    return false
                  end
                  local piece = string.sub(low, s, s + 80)
                  return string.find(piece, b, 1, true) ~= nil
                end
                if near("curl", "http") or near("wget", "http") then
                  return true
                end
                if near("envia", "secreto") or near("enviar", "secreto") or near("envia", "credencial") then
                  return true
                end
                if string.find(low, "169.254.169.254", 1, true) ~= nil then
                  return true
                end
                return false
              end

              local function add_spans(dst, src)
                for _, sp in ipairs(src) do
                  dst[#dst + 1] = sp
                end
              end

              local function input_block(text, low)
                if has_phrase(low) then
                  return true
                end
                if has_bearer(low) or has_apikey(low) then
                  return true
                end
                if assigned_secret(low, {"clave", "password", "contrasena", "contraseña", "pin", "token"}) then
                  return true
                end
                if #labeled_digits(text, low, {"cvv", "cvc", "codigo de seguridad"}, 3, 4, false) > 0 then
                  return true
                end
                return false
              end

              local function input_mask_spans(text, low)
                local spans = {}
                add_spans(spans, emails(text))
                add_spans(spans, labeled_digits(text, low, {"dni", "documento"}, 7, 8, false))
                add_spans(spans, labeled_digits(text, low, {"cuit", "cuil"}, 11, 11, false))
                add_spans(spans, labeled_digits(text, low, {"cbu", "cvu"}, 22, 22, false))
                add_spans(spans, labeled_digits(text, low, {"cuenta"}, 6, 20, false))
                add_spans(spans, labeled_digits(text, low, {"tarjeta", "card", "pan"}, 13, 19, true))
                add_spans(spans, loose_cards(text))
                add_spans(spans, alias_spans(low))
                return spans
              end

              local function output_block(text, low)
                if has_bearer(low) or has_apikey(low) then
                  return true
                end
                if assigned_secret(low, {"clave", "password", "contrasena", "contraseña", "pin", "token"}) then
                  return true
                end
                if #labeled_digits(text, low, {"cvv", "cvc", "codigo de seguridad"}, 3, 4, false) > 0 then
                  return true
                end
                if #labeled_digits(text, low, {"cuit", "cuil"}, 11, 11, false) > 0 then
                  return true
                end
                if #labeled_digits(text, low, {"cbu", "cvu"}, 22, 22, false) > 0 then
                  return true
                end
                if #labeled_digits(text, low, {"tarjeta", "card", "pan"}, 13, 19, true) > 0 then
                  return true
                end
                if #loose_cards(text) > 0 then
                  return true
                end
                return false
              end

              local function output_mask_spans(text, low)
                local spans = {}
                add_spans(spans, emails(text))
                add_spans(spans, labeled_digits(text, low, {"dni", "documento"}, 7, 8, false))
                add_spans(spans, labeled_digits(text, low, {"cuenta"}, 6, 20, false))
                add_spans(spans, alias_spans(low))
                return spans
              end

              local function mask_spans(text, spans)
                table.sort(spans, function(a, b)
                  return a[1] > b[1]
                end)
                for _, sp in ipairs(spans) do
                  local s, e = sp[1], sp[2]
                  if s >= 1 and e >= s and e <= #text then
                    text = string.sub(text, 1, s - 1) .. "[oculto]" .. string.sub(text, e + 1)
                  end
                end
                return text
              end

              local function classify_in(text)
                local low = lower_ascii(text)
                if input_block(text, low) then
                  return "block", nil
                end
                local spans = input_mask_spans(text, low)
                if #spans > 0 then
                  return "mask", mask_spans(text, spans)
                end
                if has_exfil(low) then
                  return "exfil", nil
                end
                return "clear", nil
              end

              local function classify_out(text)
                local low = lower_ascii(text)
                if output_block(text, low) then
                  return "block"
                end
                local spans = output_mask_spans(text, low)
                if #spans > 0 then
                  return "mask", mask_spans(text, spans)
                end
                return "clear", nil
              end

              local function guard_request(h, text)
                if string.find(text, '"stream"%s*:%s*true') then
                  h:streamInfo():dynamicMetadata():set("envoy.lua", "grstream", "1")
                end
                local action, newbody = classify_in(text)
                if action == "exfil" then
                  h:streamInfo():dynamicMetadata():set("envoy.lua", "grexfil", "1")
                  return "clear", nil
                end
                return action, newbody
              end
              local function guard_response(h, text)
                local md = h:streamInfo():dynamicMetadata():get("envoy.lua") or {}
                if md["grstream"] == "1" then
                  return nil, "stream-not-rewritten"
                end
                local action, newbody = classify_out(text)
                if action == "block" then
                  return '{"warning":"La respuesta fue bloqueada por la politica de guardrails.","action":"block"}', "block"
                end
                if action == "mask" then
                  return newbody, "masked"
                end
                if md["grexfil"] == "1" or has_exfil(lower_ascii(text)) then
                  return nil, "exfil-logged"
                end
                return nil, "clear"
              end
              local function route_for(path)
                for i, route in ipairs(routes) do
                  if string.find(path, route.path, 1, true) then
                    return route, i
                  end
                end
              end
              local function route_of(md)
                return routes[tonumber(md["t11r"] or "")]
              end
              local function pay(route, user, delta)
                return '{"namespace":"' .. route.ns .. '","delta":' .. delta .. ',"values":{"' .. route.key .. '":"1","auth.identity.userid":"' .. user .. '"}}'
              end
              function envoy_on_request(h)
                local path = h:headers():get(":path") or ""
                local route, idx = route_for(path)
                if route == nil then
                  return
                end
                h:streamInfo():dynamicMetadata():set("envoy.lua", "t11r", tostring(idx))
                local buf = h:body()
                local text = nil
                if buf ~= nil and buf:length() > 0 then
                  text = buf:getBytes(0, buf:length())
                end
                local user = h:headers():get("x-maas-subscription") or ""
                if user == "" then
                  user = "anon"
                end
                user = string.gsub(user, string.char(34), "")
                if text == nil or #text == 0 then
                  h:streamInfo():dynamicMetadata():set("envoy.lua", "grin", "nobody")
                else
                  local action, newbody = guard_request(h, text)
                  if action == "block" then
                    h:streamInfo():dynamicMetadata():set("envoy.lua", "t11", user)
                    h:streamInfo():dynamicMetadata():set("envoy.lua", "grin", "block")
                    h:respond({
                      [":status"] = "422",
                      ["content-type"] = "application/json",
                      ["x-guardrail"] = "block"
                    }, '{"warning":"El pedido fue bloqueado por la politica de guardrails.","action":"block"}')
                    return
                  end
                  if action == "mask" and newbody ~= nil then
                    buf:setBytes(newbody)
                    h:headers():replace("content-length", tostring(#newbody))
                    h:streamInfo():dynamicMetadata():set("envoy.lua", "grin", "masked")
                  else
                    h:streamInfo():dynamicMetadata():set("envoy.lua", "grin", action or "clear")
                  end
                  if string.find(text, '"stream"%s*:%s*true') and not string.find(text, '"stream_options"', 1, true) then
                    local cur = buf:getBytes(0, buf:length())
                    local withusage = string.gsub(cur, '"stream"%s*:%s*true', '"stream":true,"stream_options":{"include_usage":true}', 1)
                    buf:setBytes(withusage)
                    h:headers():replace("content-length", tostring(#withusage))
                  end
                end
                h:streamInfo():dynamicMetadata():set("envoy.lua", "t11", user)
                local hdrs, _body = h:httpCall("t11-limitador", {
                  [":method"] = "POST",
                  [":path"] = "/check",
                  [":authority"] = "limitador",
                  ["content-type"] = "application/json"
                }, pay(route, user, 1), 1000)
                if hdrs ~= nil and hdrs[":status"] == "429" then
                  h:respond({[":status"] = "429", ["content-type"] = "application/json"}, "{}")
                  return
                end
              end
              function envoy_on_response(h)
                local md = h:streamInfo():dynamicMetadata():get("envoy.lua")
                if md == nil or md["t11"] == nil then
                  return
                end
                if md["grin"] == "block" then
                  h:headers():replace("x-guardrail", "block")
                  return
                end
                if md["grin"] == "masked" then
                  h:headers():replace("x-guardrail", "masked")
                end
                if md["grstream"] == "1" then
                  if md["grin"] ~= "masked" then
                    h:headers():replace("x-guardrail", "stream-not-rewritten")
                  end
                  local route, tok, tail = route_of(md), nil, ""
                  for chunk in h:bodyChunks() do
                    local s = tail .. chunk:getBytes(0, chunk:length())
                    tok = string.match(s, '"total_tokens"%s*:%s*(%d+)') or tok
                    tail = string.sub(s, -80)
                  end
                  if route ~= nil and tok ~= nil then
                    h:httpCall("t11-limitador", {
                      [":method"] = "POST",
                      [":path"] = "/report",
                      [":authority"] = "limitador",
                      ["content-type"] = "application/json"
                    }, pay(route, md["t11"], tok), 1000)
                  end
                  return
                end
                local buf = h:body()
                if buf == nil or buf:length() == 0 then
                  if md["grin"] ~= "masked" then
                    h:headers():replace("x-guardrail", "clear")
                  end
                  return
                end
                local body = buf:getBytes(0, buf:length())
                local route = route_of(md)
                local tok = string.match(body, '"total_tokens"%s*:%s*(%d+)')
                local newbody, flag = guard_response(h, body)
                if newbody ~= nil and newbody ~= body then
                  buf:setBytes(newbody)
                  h:headers():replace("content-length", tostring(#newbody))
                  h:headers():replace("content-type", "application/json")
                end
                if flag == "block" or flag == "masked" then
                  h:headers():replace("x-guardrail", flag)
                elseif md["grin"] == "masked" then
                  h:headers():replace("x-guardrail", "masked")
                elseif flag == "exfil-logged" or flag == "stream-not-rewritten" then
                  h:headers():replace("x-guardrail", flag)
                else
                  h:headers():replace("x-guardrail", "clear")
                end
                if route ~= nil and tok ~= nil then
                  h:httpCall("t11-limitador", {
                    [":method"] = "POST",
                    [":path"] = "/report",
                    [":authority"] = "limitador",
                    ["content-type"] = "application/json"
                  }, pay(route, md["t11"], tok), 1000)
                end
              end
