apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-models-dev
resources:
- ../../base
- namespace-ai-models-dev.yaml
- networkpolicy-ai-models-dev-ingress.yaml
patches:
- target:
    kind: LLMInferenceService
    name: granite-3-0-8b-instruct
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
    - op: add
      path: /spec/template/initContainers/0/envFrom/0/secretRef/optional
      value: true
    - op: add
      path: /spec/template/containers/0/envFrom/0/secretRef/optional
      value: true
