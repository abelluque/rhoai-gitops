apiVersion: v1
kind: ServiceAccount
metadata:
  name: semantic-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-cache
  labels:
    app.kubernetes.io/name: semantic-cache
    app.kubernetes.io/part-of: rhoai-maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semantic-cache
        app.kubernetes.io/part-of: rhoai-maas
    spec:
      serviceAccountName: semantic-cache
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          command: ["pip3", "install", "--no-cache-dir", "--target", "/opt/py", "-r", "/opt/src/requirements.txt"]
          env:
            - name: PIP_DISABLE_PIP_VERSION_CHECK
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: src
              mountPath: /opt/src
              readOnly: true
            - name: py
              mountPath: /opt/py
      containers:
        - name: cache
          image: registry.access.redhat.com/ubi9/python-311:latest
          imagePullPolicy: IfNotPresent
          command: ["python3", "-m", "uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8080", "--app-dir", "/opt/src"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PYTHONPATH
              value: /opt/py
            - name: REDIS_URL
              value: redis://semantic-cache-redis:6379/0
            - name: EMBED_URL
              value: http://semantic-cache-embed:8080/embed
            - name: MAAS_GATEWAY_HOST
              value: maas.apps.example.invalid
            - name: MAAS_TLS_VERIFY
              value: "true"
            - name: POLICY_PATH
              value: /etc/semantic-cache/policy.yaml
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: src
              mountPath: /opt/src
              readOnly: true
            - name: py
              mountPath: /opt/py
            - name: policy
              mountPath: /etc/semantic-cache
              readOnly: true
      volumes:
        - name: src
          configMap:
            name: semantic-cache-src
        - name: policy
          configMap:
            name: semantic-cache-policy
        - name: py
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-cache
  labels:
    app.kubernetes.io/name: semantic-cache
spec:
  selector:
    app.kubernetes.io/name: semantic-cache
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: semantic-cache
  labels:
    app.kubernetes.io/name: semantic-cache
spec:
  to:
    kind: Service
    name: semantic-cache
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
