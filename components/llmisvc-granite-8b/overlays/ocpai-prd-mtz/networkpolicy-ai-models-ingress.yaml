# Ingress only. Egress stays open: the storage initializer still needs the
# corporate proxy, and an empty Egress policy in this cluster already blocked
# kube-auth-proxy. Selects every pod in ai-models.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-models-ingress
  namespace: ai-models
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-applications
