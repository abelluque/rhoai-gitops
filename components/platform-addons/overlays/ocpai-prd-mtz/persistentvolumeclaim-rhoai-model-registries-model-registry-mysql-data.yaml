apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: model-registry-mysql-data
  namespace: rhoai-model-registries
  labels:
    app.kubernetes.io/name: platform-addons
    app.kubernetes.io/instance: platform-addons
    platform-addons.rhoai.io/pvc: modelRegistryMysql
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nutanix-files-dynamic
  resources:
    requests:
      storage: 20Gi
  volumeMode: Filesystem
