apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-registry-cr
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai-maas
    rhoai.example.com/cluster: opentlc
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: rhoai
  source:
    repoURL: https://github.com/abelluque/rhoai-gitops.git
    targetRevision: rhoai-maas-demo-platform
    path: components/model-registry-cr/overlays/opentlc
  destination:
    server: https://kubernetes.default.svc
    namespace: rhoai-model-registries
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 20
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
