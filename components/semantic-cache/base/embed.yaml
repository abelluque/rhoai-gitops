apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-cache-embed
  labels:
    app.kubernetes.io/name: semantic-cache-embed
    app.kubernetes.io/part-of: rhoai-maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-cache-embed
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semantic-cache-embed
        app.kubernetes.io/part-of: rhoai-maas
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: embed
          image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
          imagePullPolicy: IfNotPresent
          args:
            - --model-id
            - redis/langcache-embed-v2
            - --port
            - "8080"
            - --hostname
            - 0.0.0.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HF_HOME
              value: /data
            - name: HUGGINGFACE_HUB_CACHE
              value: /data
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-cache-embed
  labels:
    app.kubernetes.io/name: semantic-cache-embed
spec:
  selector:
    app.kubernetes.io/name: semantic-cache-embed
  ports:
    - name: http
      port: 8080
      targetPort: http
