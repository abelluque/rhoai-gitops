# Source: openshift-ai/templates/job-restart-dashboard.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: restart-rhods-dashboard
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 6
  template:
    spec:
      serviceAccountName: restart-rhods-dashboard
      restartPolicy: Never
      containers:
        - name: restart-rhods-dashboard
          image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
          imagePullPolicy: IfNotPresent
          command: ["/scripts/restart-dashboard.sh"]
          env:
            - name: DASHBOARD_NAMESPACE
              value: redhat-ods-applications
            - name: DASHBOARD_DEPLOYMENT
              value: "rhods-dashboard"
          volumeMounts:
            - name: scripts
              mountPath: /scripts
      volumes:
        - name: scripts
          configMap:
            name: restart-rhods-dashboard-script
            defaultMode: 493
