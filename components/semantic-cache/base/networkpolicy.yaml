apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: semantic-cache-redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: semantic-cache-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: semantic-cache
      ports:
        - port: 6379
          protocol: TCP
