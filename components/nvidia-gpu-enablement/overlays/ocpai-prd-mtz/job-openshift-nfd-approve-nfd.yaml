# Source: nvidia-gpu-enablement/charts/install-nvidia-operators/templates/install-plan-approvals.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-nfd
  namespace: openshift-nfd
  labels:
    app.kubernetes.io/name: install-nvidia-operators
    app.kubernetes.io/instance: nvidia-gpu-enablement
    app.kubernetes.io/version: "0.1.0"
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 270
  template:
    spec:
      serviceAccountName: approve-nfd
      restartPolicy: Never
      containers:
      - name: approve-operator
        image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
        imagePullPolicy: IfNotPresent
        command: ["/mnt/approve-operator.sh"]
        volumeMounts:
          - name: approve-operator-script
            mountPath: /mnt
      volumes:
        - name: approve-operator-script
          configMap:
            name: approve-nfd-script
            defaultMode: 493
