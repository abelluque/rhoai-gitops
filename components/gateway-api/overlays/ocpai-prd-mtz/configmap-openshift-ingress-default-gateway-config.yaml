# Same mechanism as the OpenTLC lab: the OpenShift service CA writes the TLS secret
# that the Gateway HTTPS listener references.
apiVersion: v1
kind: ConfigMap
metadata:
  name: default-gateway-config
  namespace: openshift-ingress
data:
  service: |
    metadata:
      annotations:
        service.beta.openshift.io/serving-cert-secret-name: "maas-default-gateway-tls"
    spec:
      type: ClusterIP
