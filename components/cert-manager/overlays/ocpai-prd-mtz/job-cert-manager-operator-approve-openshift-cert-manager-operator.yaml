# Source: cert-manager/charts/install-cert-manager/templates/install-plan-approvals.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: approve-openshift-cert-manager-operator
  namespace: cert-manager-operator
  labels:
    app.kubernetes.io/name: install-cert-manager
    app.kubernetes.io/instance: cert-manager
    app.kubernetes.io/version: "0.1.0"
  annotations:
    # Sync and in the Subscription's wave: PostSync and later waves wait for the
    # Subscription to be Healthy, which only happens after this Job approves it.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 270
  template:
    spec:
      serviceAccountName: approve-openshift-cert-manager-operator
      restartPolicy: Never
      containers:
      - name: approve-operator
        image: image-registry.openshift-image-registry.svc:5000/openshift/tools:latest
        imagePullPolicy: IfNotPresent
        command: ["/mnt/approve-operator.sh"]
        volumeMounts:
          - name: approve-operator-script
            mountPath: /mnt
      volumes:
        - name: approve-operator-script
          configMap:
            name: approve-openshift-cert-manager-operator-script
            defaultMode: 493
