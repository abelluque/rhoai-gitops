apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: openshift-gitops
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
spec:
  rbac:
    defaultPolicy: role:readonly
    scopes: "[groups,name]"
    policy: |
      g, system:cluster-admins, role:admin
      g, cluster-admins, role:admin
      g, sur_admin, role:admin
      g, Prod_Adm_Accesos, role:admin
  resourceHealthChecks:
    - group: operators.coreos.com
      kind: Subscription
      check: |
        local hs = {status = "Progressing", message = "Esperando estado de la Subscription"}
        if obj.status == nil then return hs end
        if obj.status.conditions ~= nil then
          for _, c in ipairs(obj.status.conditions) do
            if c.status == "True" then
              if c.type == "ResolutionFailed" or c.type == "InstallPlanFailed"
                 or c.type == "CatalogSourcesUnhealthy"
                 or (c.type == "InstallPlanMissing" and c.reason ~= "ReferencedInstallPlanNotFound") then
                hs.status = "Degraded"
                hs.message = c.message or c.type
                return hs
              end
              if c.type == "InstallPlanPending" then
                if c.reason == "RequiresApproval" and obj.status.installedCSV ~= nil then
                  hs.status = "Healthy"
                  hs.message = "Upgrade a " .. (obj.status.currentCSV or "?") .. " pendiente de aprobación manual"
                  return hs
                end
                hs.message = c.message or "InstallPlan pendiente"
                return hs
              end
            end
          end
        end
        if obj.status.installedCSV ~= nil then
          hs.status = "Healthy"
          hs.message = obj.status.installedCSV
        end
        return hs
