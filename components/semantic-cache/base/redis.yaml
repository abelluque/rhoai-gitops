apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: semantic-cache-redis
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: semantic-cache-redis
  labels:
    app.kubernetes.io/name: semantic-cache-redis
    app.kubernetes.io/part-of: rhoai-maas
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-cache-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: semantic-cache-redis
        app.kubernetes.io/part-of: rhoai-maas
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: docker.io/redis:8.2.2
          imagePullPolicy: IfNotPresent
          command: ["redis-server"]
          args:
            - --protected-mode
            - "no"
            - --appendonly
            - "yes"
            - --dir
            - /data
            - --bind
            - 0.0.0.0
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: semantic-cache-redis
---
apiVersion: v1
kind: Service
metadata:
  name: semantic-cache-redis
  labels:
    app.kubernetes.io/name: semantic-cache-redis
spec:
  selector:
    app.kubernetes.io/name: semantic-cache-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
