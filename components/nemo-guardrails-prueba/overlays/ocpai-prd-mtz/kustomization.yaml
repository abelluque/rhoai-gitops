apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace-rhoai-nemo-prueba.yaml
  - nemoguardrails-nemo-prueba.yaml
  - networkpolicy-rhoai-nemo-prueba-ingress.yaml
  - serviceaccount-nemo-prueba-cliente.yaml
  - deployment-guardian.yaml
  - service-guardian.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: nemo-pii-ar
    namespace: rhoai-nemo-prueba
    files:
      - config.yaml=politica/pii-ar/config.yaml
      - rails.co=politica/pii-ar/rails.co
      - actions.py=politica/actions.py
  - name: nemo-guardian
    namespace: rhoai-nemo-prueba
    files:
      - config.yaml=politica/guardian/config.yaml
      - rails.co=politica/guardian/rails.co
      - actions.py=politica/actions.py
  - name: nemo-granite
    namespace: rhoai-nemo-prueba
    files:
      - config.yaml=politica/granite/config.yaml
      - rails.co=politica/granite/rails.co
      - actions.py=politica/actions.py
