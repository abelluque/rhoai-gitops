apiVersion: trustyai.opendatahub.io/v1alpha1
kind: NemoGuardrails
metadata:
  name: nemo-prueba
  namespace: rhoai-nemo-prueba
  annotations:
    security.opendatahub.io/enable-auth: "true"
spec:
  replicas: 1
  nemoConfigs:
    - name: pii-ar
      configMaps:
        - nemo-pii-ar
      default: true
    - name: guardian
      configMaps:
        - nemo-guardian
    - name: granite
      configMaps:
        - nemo-granite
  env:
    - name: OPENAI_API_KEY
      value: placeholder
    - name: GUARDRAILS_MODE
      value: block
    - name: POLICY_VERSION
      value: icbc-2026.10.27-1
    - name: GUARDIAN_URL
      value: http://guardian.rhoai-nemo-prueba.svc.cluster.local:8000/v1
    - name: GUARDIAN_MODEL
      value: granite-guardian
    - name: GRANITE_URL
      value: https://granite-3-0-8b-instruct-kserve-workload-svc.ai-models.svc.cluster.local:8000/v1
    - name: GRANITE_MODEL
      value: granite-3-0-8b-instruct
    - name: SEMANTIC_TIMEOUT
      value: "10"
    - name: GUARDIAN_THINK
      value: "false"
