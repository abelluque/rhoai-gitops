# Required because GitOps owns cluster-scoped resources and privileged
# namespaces (openshift-ingress, operator namespaces, RHOAI, Kuadrant). The
# default application-controller Role is limited to openshift-gitops and cannot
# patch Gateway API objects in other namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openshift-gitops-argocd-application-controller-cluster-admin
  labels:
    app.kubernetes.io/name: gitops-controller-rbac
    app.kubernetes.io/part-of: rhoai-maas
    app.kubernetes.io/component: gitops-controller-rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: openshift-gitops-argocd-application-controller
    namespace: openshift-gitops
