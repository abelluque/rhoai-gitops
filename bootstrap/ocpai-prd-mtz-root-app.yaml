# Apply as cluster-admin. The ClusterRoleBinding must exist before the
# application-controller can reconcile privileged namespaces:
#   oc apply -f bootstrap/gitops-controller-cluster-admin.yaml
#   oc apply -f bootstrap/ocpai-prd-mtz-root-app.yaml
# Then Argo CD syncs clusters/ocpai-prd-mtz/apps (the app-of-apps) from
# semantic-cache-demo-platform. Existing child apps keep targetRevision main.
# semantic-cache tracks this branch.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-ocpai-prd-mtz-root
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai-maas
    rhoai.example.com/cluster: ocpai-prd-mtz
spec:
  project: default
  source:
    repoURL: https://github.com/abelluque/rhoai-gitops.git
    targetRevision: semantic-cache-demo-platform
    path: clusters/ocpai-prd-mtz/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
