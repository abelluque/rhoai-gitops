# Hugging Face detector for hate, abuse and profanity.
# CPU only. It is not on the MaaS path until the pod is Running.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrails-hap
  namespace: rhoai-guardrails
  labels:
    app: guardrails-hap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guardrails-hap
  template:
    metadata:
      labels:
        app: guardrails-hap
    spec:
      initContainers:
        - name: storage-initializer
          image: registry.redhat.io/rhoai/odh-kserve-storage-initializer-rhel9@sha256:b73f3818b1c3b6f57d9cac6b975552c5888bf9c0d37df6c50938fd4988d2012b
          args:
            - hf://ibm-granite/granite-guardian-hap-38m
            - /mnt/models
          env:
            - name: HTTP_PROXY
              value: http://10.214.130.110:80
            - name: HTTPS_PROXY
              value: http://10.214.130.110:80
            - name: NO_PROXY
              value: 127.0.0.1,localhost,.intranet.local,.ardp.local,.svc,.cluster.local
            - name: http_proxy
              value: http://10.214.130.110:80
            - name: https_proxy
              value: http://10.214.130.110:80
            - name: no_proxy
              value: 127.0.0.1,localhost,.intranet.local,.ardp.local,.svc,.cluster.local
          envFrom:
            - secretRef:
                name: hf-token
                optional: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /mnt/models
      containers:
        - name: detector
          image: quay.io/trustyai/guardrails-detector-huggingface-runtime:v0.2.0
          args:
            - "--workers=1"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--log-config=/common/log_conf.yaml"
          command:
            - uvicorn
            - app:app
          env:
            - name: MODEL_DIR
              value: /mnt/models
            - name: HF_HOME
              value: /tmp/hf_home
            - name: SAFE_LABELS
              value: "[0]"
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 4Gi
          volumeMounts:
            - name: models
              mountPath: /mnt/models
              readOnly: true
      volumes:
        - name: models
          emptyDir: {}
