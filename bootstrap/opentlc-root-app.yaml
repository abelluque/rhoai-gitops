# Apply as cluster-admin. The ClusterRoleBinding must exist before the
# application-controller can reconcile privileged namespaces:
#   oc apply -f bootstrap/gitops-controller-cluster-admin.yaml
#   oc apply -f bootstrap/opentlc-root-app.yaml
# Then Argo CD syncs clusters/opentlc/apps (the app-of-apps).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rhoai-opentlc-root
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/part-of: rhoai-maas
spec:
  project: default
  source:
    repoURL: https://github.com/abelluque/rhoai-gitops.git
    targetRevision: rhoai-maas-demo-platform
    path: clusters/opentlc/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: openshift-gitops
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 10
      backoff:
        duration: 20s
        factor: 2
        maxDuration: 5m
