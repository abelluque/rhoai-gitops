apiVersion: v1
kind: ServiceAccount
metadata:
  name: guardrails-harness
  namespace: rhoai-trustyai-guardrails
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: guardrails-harness-view
  namespace: rhoai-trustyai-guardrails
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: guardrails-harness
    namespace: rhoai-trustyai-guardrails
