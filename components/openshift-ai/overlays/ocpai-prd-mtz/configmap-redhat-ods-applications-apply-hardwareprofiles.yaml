# Source: openshift-ai/templates/hardwareprofiles.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: apply-hardwareprofiles
  namespace: redhat-ods-applications
data:
  hardwareprofiles.yaml: |
    ---
    apiVersion: infrastructure.opendatahub.io/v1alpha1
    kind: HardwareProfile
    metadata:
      name: cpu-platform
      namespace: redhat-ods-applications
      annotations:
        opendatahub.io/disabled: "false"
        opendatahub.io/display-name: "CPU platform (infra + virt workers)"
    spec:
      identifiers:
        - identifier: cpu
          displayName: CPU
          resourceType: CPU
          minCount: 1
          defaultCount: 2
          maxCount: 8
        - identifier: memory
          displayName: Memory
          resourceType: Memory
          minCount: "2Gi"
          defaultCount: "8Gi"
          maxCount: "32Gi"
      scheduling:
        type: Node
        node:
          nodeSelector:
            workload.rhoai.io/platform: "true"
    ---
    apiVersion: infrastructure.opendatahub.io/v1alpha1
    kind: HardwareProfile
    metadata:
      name: gpu
      namespace: redhat-ods-applications
      annotations:
        opendatahub.io/disabled: "false"
        opendatahub.io/display-name: "NVIDIA H200"
    spec:
      identifiers:
        - identifier: cpu
          displayName: CPU
          resourceType: CPU
          minCount: 2
          defaultCount: 4
          maxCount: 16
        - identifier: memory
          displayName: Memory
          resourceType: Memory
          minCount: "16Gi"
          defaultCount: "32Gi"
          maxCount: "128Gi"
        - identifier: nvidia.com/gpu
          resourceType: Accelerator
          displayName: NVIDIA GPU
          minCount: 1
          maxCount: 6
          defaultCount: 1
      scheduling:
        type: Node
        node:
          nodeSelector:
            nvidia.com/gpu.present: "true"
          tolerations:
          - effect: NoSchedule
            key: nvidia.com/gpu
            operator: Exists
  apply-hardwareprofiles.sh: |
    #!/bin/bash
    set -euo pipefail
    
    MANIFEST="/config/hardwareprofiles.yaml"
    
    echo "Waiting for HardwareProfile API..."
    while true; do
      if output=$(oc apply -f "${MANIFEST}" 2>&1); then
        echo "${output}"
        break
      fi
      echo "${output}"
      sleep 10
    done
    
    echo "HardwareProfiles applied"
